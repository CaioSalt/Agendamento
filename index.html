<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento · Barbearia Daniel Camilette</title>
  <meta name="description" content="Agende seu horário na Barbearia Daniel Camilette, desde 1987.">
  <meta name="theme-color" content="#161618">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Kaushan+Script&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="pagina">
    <header class="marca">
      <span class="poste" aria-hidden="true"><i></i></span>
      <div class="marca-texto">
        <span class="marca-script">Barbearia</span>
        <span class="marca-desde">Desde <b>•</b> 1987</span>
        <span class="marca-nome">Daniel Camilette</span>
      </div>
      <span class="poste" aria-hidden="true"><i></i></span>
    </header>

    <div id="status" class="selo" role="status">Verificando horário…</div>

    <section class="cartao" id="secaoForm">
      <h1 class="titulo">Agende seu horário</h1>
      <p class="subtitulo">Leva menos de um minuto.</p>

      <form id="form" novalidate>
        <div class="passo" role="radiogroup" aria-labelledby="t-servico">
          <h2 class="passo-titulo" id="t-servico"><span class="num">1</span>Serviço</h2>
          <div class="opcoes" id="servicos"></div>
        </div>

        <div class="passo" role="radiogroup" aria-labelledby="t-dia">
          <h2 class="passo-titulo" id="t-dia"><span class="num">2</span>Dia</h2>
          <div class="dias" id="dias"></div>
        </div>

        <div class="passo" role="radiogroup" aria-labelledby="t-horario">
          <h2 class="passo-titulo" id="t-horario"><span class="num">3</span>Horário</h2>
          <div id="horarios"><p class="vazio">Escolha um dia para ver os horários livres.</p></div>
        </div>

        <div class="passo">
          <h2 class="passo-titulo"><span class="num">4</span>Seus dados</h2>
          <div class="campo">
            <label for="nome">Nome</label>
            <input class="entrada" type="text" id="nome" name="nome" maxlength="60" autocomplete="name" placeholder="Como podemos te chamar?" required>
          </div>
          <div class="campo">
            <label for="telefone">WhatsApp <em>(opcional)</em></label>
            <input class="entrada" type="tel" id="telefone" name="telefone" inputmode="numeric" autocomplete="tel" placeholder="(00) 00000-0000">
          </div>
        </div>

        <div class="resumo" id="resumo" hidden></div>
        <p class="erro" id="erro" role="alert" hidden></p>

        <button class="botao" type="submit" id="btnConfirmar" disabled>Confirmar agendamento</button>
      </form>
    </section>

    <section class="cartao sucesso" id="secaoSucesso" hidden tabindex="-1">
      <div class="sucesso-icone" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1 class="titulo">Horário confirmado!</h1>
      <p class="subtitulo">Te esperamos na barbearia. 💈</p>
      <ul class="detalhes" id="detalhes"></ul>
      <button class="botao botao-secundario" type="button" id="btnNovo">Fazer outro agendamento</button>
    </section>

    <footer class="rodape">
      <a href="login.html">Área do barbeiro</a>
    </footer>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/agendar.js"></script>
</body>
</html>
