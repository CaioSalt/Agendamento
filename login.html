<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Barbearia Daniel Camilette</title>
  <meta name="theme-color" content="#161618">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Kaushan+Script&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="pagina">
    <header class="marca">
      <span class="poste" aria-hidden="true"><i></i></span>
      <div class="marca-texto">
        <span class="marca-script">Barbearia</span>
        <span class="marca-desde">Desde <b>•</b> 1987</span>
        <span class="marca-nome">Daniel Camilette</span>
      </div>
      <span class="poste" aria-hidden="true"><i></i></span>
    </header>

    <section class="cartao">
      <h1 class="titulo">Área do barbeiro</h1>
      <p class="subtitulo">Entre para ver e gerenciar os agendamentos.</p>

      <form id="form" novalidate>
        <div class="campo" style="margin-top: 20px">
          <label for="email">E-mail</label>
          <input class="entrada" type="email" id="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input class="entrada" type="password" id="senha" autocomplete="current-password" required>
        </div>

        <p class="erro" id="erro" role="alert" hidden></p>
        <p class="ok" id="ok" role="status" hidden></p>

        <button class="botao" type="submit" id="btnEntrar">Entrar</button>
      </form>

      <p style="text-align: center; margin: 16px 0 0">
        <button class="botao-link" type="button" id="btnEsqueci">Esqueci minha senha</button>
      </p>
    </section>

    <footer class="rodape">
      <a href="index.html">← Voltar para o agendamento</a>
    </footer>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
